name: "Destroy workflow for EKS cluster"

on:
  workflow_call:
    inputs:
      terraform_version:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      eks_cluster_name:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: setup environment
        uses: ./.github/actions/setup-composite
        with:
          aws-region: ${{ inputs.aws_region }}
          aws-access-key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          terraform_version: ${{ inputs.terraform_version }}
          
      - name: Terraform Init
        run: terraform init
      
      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan for Destroy
        run: terraform plan -destroy
        env:
          TF_VAR_eks_cluster_name: ${{ inputs.eks_cluster_name }}
      
      - name: Update kubeconfig
        run: |
          if ! aws eks describe-cluster --name ${{ inputs.eks_cluster_name }} --region ${{ inputs.aws_region }}; then
            echo "Cluster ${{ inputs.eks_cluster_name }} not found, skipping kubeconfig update."
          else
            aws eks update-kubeconfig \
              --name ${{ inputs.eks_cluster_name }} \
              --region ${{ inputs.aws_region }}
          fi

      - name: Teardown AWS Load Balancer Controller
        run: |
          chmod +x resources/scripts/teardown-lb-controller.sh
          ./resources/scripts/teardown-lb-controller.sh ${{ inputs.aws_region }}

      - name: Teardown Karpenter
        run: |
          chmod +x resources/scripts/teardown-karpenter.sh
          ./resources/scripts/teardown-karpenter.sh

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
        env:
          TF_VAR_eks_cluster_name: ${{ inputs.eks_cluster_name }}
