name: "Workflow to deploy an EKS cluster into AWS"

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What action would you like to do?'
        required: true
        type: choice
        options:
          - 'deploy'
          - 'destroy'

env:
  TERRAFORM_VERSION: '1.16.5'
  AWS_REGION: 'us-east-1'
  EKS_CLUSTER_NAME: "devopslab-eks"

jobs:
  setup-env-variables:
    runs-on: ubuntu-latest
    outputs:
      TERRAFORM_VERSION: ${{ steps.set-env.outputs.TERRAFORM_VERSION }}
      AWS_REGION: ${{ steps.set-env.outputs.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ steps.set-env.outputs.EKS_CLUSTER_NAME }}
    steps:
      - name: Set environment variables
        id: set-env
        run: |
          echo "TERRAFORM_VERSION=${{ env.TERRAFORM_VERSION }}" >> $GITHUB_OUTPUT
          echo "AWS_REGION=${{ env.AWS_REGION }}" >> $GITHUB_OUTPUT
          echo "EKS_CLUSTER_NAME=${{ env.EKS_CLUSTER_NAME }}" >> $GITHUB_OUTPUT

  call-deploy-workflow:
    if: ${{ github.event.inputs.action == 'deploy' }}
    uses: ./.github/workflows/deploy.yml
    needs: setup-env-variables
    secrets: inherit
    with:
      terraform_version: ${{ needs.setup-env-variables.outputs.TERRAFORM_VERSION }}
      aws_region: ${{ needs.setup-env-variables.outputs.AWS_REGION }}
      eks_cluster_name: ${{ needs.setup-env-variables.outputs.EKS_CLUSTER_NAME }}

  call-destroy-workflow:
    if: ${{ github.event.inputs.action == 'destroy' }}
    uses: ./.github/workflows/destroy.yml
    needs: setup-env-variables
    secrets: inherit
    with:
      terraform_version: ${{ needs.setup-env-variables.outputs.TERRAFORM_VERSION }}
      aws_region: ${{ needs.setup-env-variables.outputs.AWS_REGION }}
      eks_cluster_name: ${{ needs.setup-env-variables.outputs.EKS_CLUSTER_NAME }}
