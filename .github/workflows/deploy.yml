name: "Deploy workflow for EKS cluster"

on:
  workflow_call:
    inputs:
      terraform_version:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      eks_cluster_name:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: setup environment
        uses: ./.github/actions/setup-composite
        with:
          aws-region: ${{ inputs.aws_region }}
          aws-access-key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Init
        run: terraform init
      
      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan
        env:
          TF_VAR_eks_cluster_name: ${{ inputs.eks_cluster_name }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_eks_cluster_name: ${{ inputs.eks_cluster_name }}
      
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ inputs.eks_cluster_name }} \
            --region ${{ inputs.aws_region }}

      - name: Setup AWS Load Balancer Controller
        run: |
          chmod +x resources/scripts/setup-lb-controller.sh
          ./resources/scripts/setup-lb-controller.sh ${{ inputs.eks_cluster_name }} ${{ inputs.aws_region }}

      - name: Install Karpenter
        run: |
          chmod +x resources/scripts/install-karpenter.sh
          ./resources/scripts/install-karpenter.sh ${{ inputs.eks_cluster_name }}

      - name: Apply Karpenter NodePool and EC2NodeClass
        run: |
          sed "s/CLUSTER_NAME/${{ inputs.eks_cluster_name }}/g" resources/manifests/karpenter-nodepool.yaml | kubectl apply -f -
